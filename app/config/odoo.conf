[options]
; Configuración de Odoo Community para Makip Te Crea
db_name = makip
dbfilter = ^makip$
list_db = False
proxy_mode = True
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
workers = 2
max_cron_threads = 1
limit_memory_soft = 1073741824
limit_memory_hard = 1342177280
limit_time_cpu = 120
limit_time_real = 240
log_level = info
; admin_passwd se define fuera del repositorio (Secret Manager) antes de producción
