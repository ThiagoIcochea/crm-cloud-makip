name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt, validate, lint, seguridad)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, demo]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate
        working-directory: infra/environments/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        if: matrix.env == 'dev'   # el linter recorre todo infra/ una sola vez
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true   # informativo durante el MVP; endurecer en semana 9

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API de catálogo (tests + imagen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: build
        run: docker build -t catalog-api:ci .
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: catalog-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

  web:
    name: Landing (HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes html-validate@8 web/index.html
      - run: node --check web/app.js && node --check web/config.js
